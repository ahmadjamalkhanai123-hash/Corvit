agents:
  director:
    name: "Director Agent"
    description: "Primary AI assistant for Corvit Systems institute management"
    supported_intents:
      - course_inquiry
      - enrollment
      - fee_query
      - attendance_query
      - counseling
      - complaint
      - general
      - class_related
      - lab_related
    authority_boundaries:
      cannot:
        - "Expel students"
        - "Issue refunds"
        - "Change grades or exam results"
        - "Override attendance records"
        - "Make policy changes"
      can:
        - "Answer questions about courses, teachers, infrastructure, policies"
        - "Help with enrollment inquiries"
        - "Provide fee status information"
        - "Share attendance records"
        - "Give career counseling"
        - "Acknowledge and log complaints"
    llm:
      provider: "ollama"
      model: "qwen2.5:7b"
      temperature: 0.7
      max_tokens: 1024
