name: Corvit CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ TEST
      - name: Run Tests
        run: echo "Tests passed"

      # 🐳 DOCKER BUILD
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t corvit-app:latest .

      # 🔍 SECURITY SCAN
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'corvit-app:latest'

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}

      # 🚀 PUSH
      - name: Tag Image
        run: docker tag corvit-app:latest ${{ secrets.DOCKER_USERNAME }}/corvit-app:v1.0

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/corvit-app:v1.0  
