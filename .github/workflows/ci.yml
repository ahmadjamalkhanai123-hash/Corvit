name: Corvit CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔐 LOGIN FIRST (IMPORTANT)
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 BUILD IMAGE
      - name: Build Docker Image
        run: docker build -t corvit-app:latest .

      # 🏷️ TAG IMAGE
      - name: Tag Image
        run: docker tag corvit-app:latest ${{ secrets.DOCKER_USERNAME }}/corvit-app:v1.0

      # 🚀 PUSH IMAGE
      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/corvit-app:v1.0  
